plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Optional integrations. They are compile-time only: the mod never requires them at runtime.
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
	maven { name = 'henkelmax'; url = 'https://maven.maxhenkel.de/repository/public' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"eyeball" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Automated in-game tests (./gradlew runClientGameTest). They launch a real client,
	// create worlds and a dedicated server, and take screenshots of every feature.
	configureTests {
		createSourceSet = true
		modId = "eyeball-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		// Kept between runs so the "settings survive a restart" test can check the saved config.
		clearRunDirectory = false
		username = "GooglyTester"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu: adds a "Configure" button in the mods list when Mod Menu is installed.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Simple Voice Chat: real voice-activity lip sync when Simple Voice Chat is installed.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
	clientCompileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

dependencies {
	// Mods placed next to the built jar when testing it in a production (non-development) environment.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// The in-game test suite packaged as its own mod, so it can run against the real release jar.
def gametestJar = tasks.register("gametestJar", Jar) {
	archiveClassifier = "gametest"
	destinationDirectory = layout.buildDirectory.dir("gametest-libs")
	from sourceSets.gametest.output
}

// ./gradlew runProductionClientGameTest - launches real Fabric Loader with a mods folder containing
// the built eyeball jar, Fabric API and the test mod, and runs the whole in-game test suite.
tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "verification"
	description = "Runs the in-game test suite against the built mod jar in a production Fabric environment."
	def prodRunDir = layout.buildDirectory.dir("run/productionClientGameTest")
	mods.from(tasks.named("jar"))
	mods.from(gametestJar)
	mods.from(configurations.productionRuntimeMods)
	jvmArgs.add("-Dfabric.client.gametest")
	runDir = prodRunDir
	doFirst {
		def dir = prodRunDir.get().asFile
		dir.mkdirs()
		new File(dir, "eula.txt").text = "eula=true\n"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	manifest {
		attributes(
			"Implementation-Title": "EyeBall Mod",
			"Implementation-Version": project.version
		)
	}
}
