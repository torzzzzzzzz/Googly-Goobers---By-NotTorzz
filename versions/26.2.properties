# Minecraft 26.2: ./gradlew build -Pmc=26.2
minecraft_version=26.2
# Fabric version predicate written into fabric.mod.json ("~26.2" = 26.2 and its 26.2.x patches)
minecraft_dependency=~26.2
fabric_api_version=0.161.0+26.2
modmenu_version=20.0.3
java_version=25
# Shared sources for all Minecraft 26.x versions: src/<set>/java-mc26.x
source_family=mc26.x
# 26.x ships without obfuscation: no mappings or remapping needed
obfuscated=false
