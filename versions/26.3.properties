# Minecraft 26.3 (default target): ./gradlew build
minecraft_version=26.3
# Fabric version predicate written into fabric.mod.json ("~26.3" = 26.3 and its 26.3.x patches)
minecraft_dependency=~26.3
fabric_api_version=0.166.2+26.3
modmenu_version=21.0.1
java_version=25
# Shared sources for all Minecraft 26.x versions: src/<set>/java-mc26.x
source_family=mc26.x
# 26.x ships without obfuscation: no mappings or remapping needed
obfuscated=false
